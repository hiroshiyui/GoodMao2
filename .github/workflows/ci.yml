name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: mix test
    # Pinned, not ubuntu-latest: setup-beam installs the exact .tool-versions runtime from
    # builds.hex.pm, which publishes per Ubuntu release. When the -latest label moves to a
    # new release, a pin with no build there fails CI for no code change. Move this
    # deliberately, after checking both .tool-versions builds exist for the new image.
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16
        # Match config/test.exs: a goodmao2/goodmao2 role (superuser here, so it has
        # CREATEDB) and the test database the `test` alias creates.
        env:
          POSTGRES_USER: goodmao2
          POSTGRES_PASSWORD: goodmao2
          POSTGRES_DB: goodmao2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodmao2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The media purification toolchain (ADR-0005): ffmpeg/ffprobe re-encode images and
      # remux video to strip EXIF/GPS. The suite generates real test clips (needs libx264).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Pin Erlang/Elixir to the versions in .tool-versions.
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # The esbuild binary lives in _build, so the cache above appears to cover it -- but a
      # cache is only *saved* when its key misses, and this key is mix.lock. The entry was
      # written before the service-worker step existed, so every run since restored a cache
      # with no binary, hit the key exactly, and never re-saved: esbuild was re-downloaded
      # from npm on every build. One 504 from the registry then failed CI (run 30009215295).
      #
      # A separate cache fixes that: it misses once, saves, and hits thereafter. Keyed on
      # config/config.exs rather than the version literal -- `mix esbuild.install --if-missing`
      # keeps whatever binary it finds, so a key that did not change on a version bump would
      # silently build the app with the old esbuild. Hashing the file that declares the version
      # cannot drift from it; the cost is one extra download when any config changes.
      - name: Cache the esbuild binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/esbuild-*
          key: ${{ runner.os }}-esbuild-${{ hashFiles('config/config.exs') }}

      # The compiled Rust NIF (ADR-0017) needs its own cache for the same reason esbuild does,
      # plus a worse one: `_build/<env>/lib/goodmao2/priv` is a *symlink* to the project's
      # `priv/`, so `priv/native/goodmao2_native.so` is never inside the cached `_build`
      # archive at all -- only the symlink is. A fresh checkout has no `priv/native/` (it is
      # git-ignored), so every exact hit on the cache above restored a tree with no shared
      # object.
      #
      # Keyed on the crate's own inputs, not mix.lock: those are what determine the binary,
      # and mix.lock changing is neither necessary nor sufficient for it to be stale.
      # `mix.lock` is in the key too because the `rustler` crate and the `:rustler` dep must
      # stay in lockstep (see CLAUDE.md) -- a bump to one must not reuse a binary built
      # against the other. Caching `target/` as well keeps a miss to seconds rather than a
      # cold Rust build.
      - name: Cache the compiled Rust NIF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            priv/native
            native/goodmao2_native/target
          key: ${{ runner.os }}-nif-${{ hashFiles('native/goodmao2_native/src/**', 'native/goodmao2_native/Cargo.toml', 'native/goodmao2_native/Cargo.lock', 'rust-toolchain.toml', 'mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      # If the NIF is still missing after the cache step, the compile below must actually
      # rebuild it -- and it will not on its own. A restored `_build` carries manifests
      # saying the app is fully compiled, so `mix compile` no-ops, Rustler never runs, and
      # the failure surfaces only at test time as "Failed to load NIF library" plus an
      # undefined `Goodmao2.Native.add/2` (run 30765582282). Dropping the app's build
      # artifacts forces a rebuild; deps stay cached, so this costs seconds.
      - name: Force a NIF rebuild when it is absent
        run: |
          if [ ! -f priv/native/goodmao2_native.so ]; then
            echo "NIF missing -- clearing the app build so the compile step rebuilds it"
            rm -rf "_build/${MIX_ENV}/lib/goodmao2"
          fi

      - name: Check for unused deps in the lockfile
        run: mix deps.unlock --check-unused

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      # Fails when a gettext() call was added, removed or moved to another file without
      # re-extracting. errors.pot is hand-maintained (changeset messages aren't extractable);
      # its entries carry no `elixir-autogen` flag, so extraction never purges them.
      - name: Check the .pot templates are up to date
        run: mix gettext.extract --check-up-to-date

      # Two advisory databases, deliberately: they disagree (a HIGH bandit advisory was in
      # hex.pm's and absent from mix_audit's), and `mix precommit` already runs both.
      - name: Dependency advisory audit
        run: mix deps.audit

      - name: Hex retirement and advisory audit
        run: mix hex.audit

      - name: Static security scan (Sobelow)
        run: mix sobelow --config

      # priv/static/service_worker.js is a git-ignored esbuild output, so a fresh checkout
      # has no service worker to serve and the PWA test 404s. Only this bundle is needed --
      # the manifest and icons are committed, and no test asserts on the app/CSS bundles.
      - name: Build the service worker bundle
        # On a cache miss this reaches npm, which fails often enough to matter -- a single 504
        # took down an otherwise green build. Retry before giving up so a registry blip does
        # not read as a broken commit.
        run: |
          for attempt in 1 2 3; do
            mix esbuild.install --if-missing && break
            echo "esbuild install failed (attempt $attempt/3); retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          mix esbuild.install --if-missing
          mix esbuild service_worker

      # With coverage, as a report only: mix.exs sets the threshold to 0, so the number never
      # fails a build (a number to reach rewards tests written for it). The total goes in the
      # run summary and the per-module HTML is an artifact.
      - name: Run tests
        run: |
          set -o pipefail
          mix test --warnings-as-errors --cover | tee test-output.txt

      - name: Report coverage
        if: always()
        run: |
          {
            echo '## Test coverage'
            echo
            echo '```'
            grep -E '^\| +[0-9.]+% \| Total' test-output.txt || echo 'no coverage total (the test step did not finish)'
            echo '```'
            echo
            echo 'The per-module HTML report is the `coverage-report` artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: cover/
          if-no-files-found: ignore
          retention-days: 14

  # What review would otherwise have to catch, beyond the compiler and the tests: Dialyzer
  # against its reviewed baseline, the NIF crate's clippy and unit tests, and ansible-lint
  # (Baudrate b8d43a86). Not in `mix precommit`, which has to stay quick and runnable without
  # a PLT.
  static:
    name: static checks
    runs-on: ubuntu-24.04 # pinned; see the `test` job
    # Dialyzer, like the baseline in .dialyzer_ignore.exs, analyses the dev build.
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-dev-

      # Building the PLT takes minutes; checking a cached one takes seconds. The PLT depends on
      # the runtime and every dep, so both are in the key. A restore-key hit is still worth
      # having: dialyxir updates a stale PLT incrementally, and the miss saves the new one.
      - name: Cache the Dialyzer PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('.tool-versions', '**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-

      # The NIF crate (ADR-0017). rust-toolchain.toml pins the channel and names clippy as a
      # component, so rustup installs the pinned compiler's own clippy here. Each NIF is a thin
      # wrapper over a plain function, which is what `cargo test` exercises: the NIF itself
      # only runs inside a loaded BEAM, where the ExUnit suite covers it.
      - name: NIF crate -- clippy and unit tests
        working-directory: native/goodmao2_native
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Install dependencies
        run: mix deps.get

      # Fails on any warning not in .dialyzer_ignore.exs, and on an entry there that no longer
      # matches anything (list_unused_filters), so the baseline can only shrink by review.
      - name: Dialyzer
        run: mix dialyzer --format github

      # Version-pinned, as are the collections it resolves modules from
      # (ansible/requirements.yml): a new ansible-lint release adds rules, and that should
      # arrive as a reviewed bump, not as a red build on an unrelated commit. --include-deps
      # exposes the ansible-galaxy that ships with it.
      - name: Install ansible-lint and the playbooks' collections
        run: |
          pipx install --include-deps ansible-lint==26.9.0
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: ansible-lint
        working-directory: ansible
        # host_group_vars only: ansible.cfg also enables the SOPS vars plugin, which would try
        # to decrypt the production secrets CI never holds.
        env:
          ANSIBLE_VARS_ENABLED: host_group_vars
        run: ansible-lint playbooks/ roles/

  feature:
    name: mix test.feature
    runs-on: ubuntu-24.04 # pinned; see the `test` job
    # A browser that stops responding would otherwise sit here until the six-hour default.
    # The suite takes ~80s locally; this is generous enough for a cold JVM and a cache miss.
    timeout-minutes: 20
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goodmao2
          POSTGRES_PASSWORD: goodmao2
          POSTGRES_DB: goodmao2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodmao2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ffmpeg is deliberately not installed here: no feature test uploads media, so the
      # purifier never runs. Add it (as the `test` job does) if one ever does.

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # `mix test.feature` runs `assets.build`, which needs the Tailwind binary as well as
      # esbuild. Same caching rationale as the `test` job: keyed on the file that declares the
      # version, because `--if-missing` keeps whatever binary it finds and a stale key would
      # silently build with the old one.
      - name: Cache the esbuild and Tailwind binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/esbuild-*
            _build/tailwind-*
          key: ${{ runner.os }}-assets-${{ hashFiles('config/config.exs') }}

      - name: Cache the compiled Rust NIF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            priv/native
            native/goodmao2_native/target
          key: ${{ runner.os }}-nif-${{ hashFiles('native/goodmao2_native/src/**', 'native/goodmao2_native/Cargo.toml', 'native/goodmao2_native/Cargo.lock', 'rust-toolchain.toml', 'mix.lock') }}

      # The Selenium JAR is ~58 MB and GeckoDriver is compiled from its source crate, so a
      # miss costs a download plus a Rust build. Keyed on the task itself: it holds both
      # pinned versions and both SHA-256 checksums, so the key cannot drift from what it
      # installs.
      #
      # The runner image already ships Firefox and GeckoDriver 0.37.1 -- the same version this
      # pins -- but the image takes GeckoDriver from the upstream release binaries, which are
      # signed by a Mozilla subkey revoked as compromised. That is the whole reason the task
      # builds it from source, so CI installs it the same way rather than borrowing the
      # image's copy. Firefox itself comes from the image.
      - name: Cache Selenium Server and GeckoDriver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/selenium
          key: ${{ runner.os }}-selenium-${{ hashFiles('lib/mix/tasks/selenium_setup.ex') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Force a NIF rebuild when it is absent
        run: |
          if [ ! -f priv/native/goodmao2_native.so ]; then
            echo "NIF missing -- clearing the app build so the compile step rebuilds it"
            rm -rf "_build/${MIX_ENV}/lib/goodmao2"
          fi

      # Fail with something readable rather than "Could not start a new session" if the image
      # ever drops the browser.
      - name: Check Firefox is present
        run: firefox --version || { echo "::error::Firefox is not on this runner; the feature tests cannot run"; exit 1; }

      - name: Install the asset toolchain
        # Both installers reach npm on a cache miss, and a single registry 504 has failed an
        # otherwise green build before. Retry before giving up.
        run: |
          for attempt in 1 2 3; do
            mix assets.setup && break
            echo "asset toolchain install failed (attempt $attempt/3); retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          mix assets.setup

      - name: Install Selenium Server and GeckoDriver
        run: mix selenium.setup

      # Starts the Selenium server itself (test_helper.exs) and drives a real Firefox.
      - name: Run browser feature tests
        run: mix test.feature

      # A browser failure is almost unreadable from a stack trace alone; Wallaby writes a
      # screenshot per failure, which is usually the whole diagnosis.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallaby-screenshots
          path: tmp/wallaby_screenshots/
          if-no-files-found: ignore
          retention-days: 7
