version: 2
updates:
  # Elixir/Hex dependencies. Grouped so related bumps land in one PR to review.
  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      hex:
        patterns: ["*"]
    # `:rustler` must move in lockstep with the `rustler` crate (ADR-0017); a one-sided
    # bump can break the NIF glue, so it is bumped by hand as a pair (check-updates skill).
    ignore:
      - dependency-name: rustler

  # Rust crates of the NIF (native/goodmao2_native). The toolchain channel in
  # rust-toolchain.toml is not a Dependabot ecosystem; check-updates covers it.
  - package-ecosystem: cargo
    directory: "/native/goodmao2_native"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(native)"
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      - dependency-name: rustler

  # The Rust compiler channel pinned by rust-toolchain.toml.
  - package-ecosystem: rust-toolchain
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(native)"

  # Frontend toolchain. assets/package.json is a version manifest only (never installed);
  # a PR bumping it fails Goodmao2.AssetVersionsTest until the real pin moves with it:
  # esbuild/tailwind in config/config.exs, daisyUI by re-vendoring assets/vendor/.
  - package-ecosystem: npm
    directory: "/assets"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(assets)"

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
