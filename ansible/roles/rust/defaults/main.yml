---
# rustup-init, pinned by version and SHA-256 rather than piped from https://sh.rustup.rs into
# a shell: a swapped script would run as the application user with nothing checking it.
# rustup then verifies the toolchain it installs (rust-toolchain.toml) against the channel
# manifest. To move the pin, take the version from
# https://static.rust-lang.org/rustup/release-stable.toml and the digest from
# .../rustup/archive/<version>/x86_64-unknown-linux-gnu/rustup-init.sha256, and check a
# download against it yourself.
rust_rustup_version: "1.29.1"
rust_rustup_init_sha256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
