---
# Rust toolchain for the Rustler NIF (native/goodmao2_native, ADR-0017). The
# exact toolchain is pinned by rust-toolchain.toml and auto-installed by rustup
# on first `mix compile`.
- name: Check if rustup is installed
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.stat:
    path: "{{ goodmao_home }}/.cargo/bin/rustup"
  register: rustup_installed

# rustup-init is downloaded by version and checked against a pinned SHA-256 (defaults/main.yml),
# never piped from a URL into a shell. The digest is for x86_64 Linux, the provisioned target;
# get_url refuses the file on any other build.
- name: Download rustup-init
  when: not rustup_installed.stat.exists
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.get_url:
    url: "https://static.rust-lang.org/rustup/archive/{{ rust_rustup_version }}/x86_64-unknown-linux-gnu/rustup-init"
    checksum: "sha256:{{ rust_rustup_init_sha256 }}"
    dest: "{{ goodmao_home }}/rustup-init"
    mode: "0755"

- name: Install rustup
  when: not rustup_installed.stat.exists
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.command:
    cmd: "{{ goodmao_home }}/rustup-init -y --profile minimal"
    creates: "{{ goodmao_home }}/.cargo/bin/rustup"
  environment:
    CARGO_HOME: "{{ goodmao_home }}/.cargo"
    RUSTUP_HOME: "{{ goodmao_home }}/.rustup"

- name: Remove rustup-init
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.file:
    path: "{{ goodmao_home }}/rustup-init"
    state: absent

- name: Update Rust toolchain
  when: rustup_installed.stat.exists
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.command:
    cmd: "{{ goodmao_home }}/.cargo/bin/rustup update"
  environment:
    CARGO_HOME: "{{ goodmao_home }}/.cargo"
    RUSTUP_HOME: "{{ goodmao_home }}/.rustup"
  register: rustup_update
  changed_when: "'updated' in rustup_update.stdout"
