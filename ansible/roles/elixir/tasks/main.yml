---
- name: Install asdf build dependencies
  ansible.builtin.apt:
    name:
      - curl
      - git
      - autoconf
      - libncurses-dev
      - libssl-dev
      - libwxgtk3.2-dev
      - unixodbc-dev
    state: present

- name: Create asdf bin directory
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.file:
    path: "{{ goodmao_home }}/.asdf/bin"
    state: directory
    mode: "0755"

- name: Download asdf binary
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.get_url:
    url: "https://github.com/asdf-vm/asdf/releases/download/v{{ asdf_version }}/asdf-v{{ asdf_version }}-linux-amd64.tar.gz"
    dest: "/tmp/asdf-v{{ asdf_version }}.tar.gz"
    mode: "0644"

- name: Extract asdf binary
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.unarchive:
    src: "/tmp/asdf-v{{ asdf_version }}.tar.gz"
    dest: "{{ goodmao_home }}/.asdf/bin"
    remote_src: true

- name: Verify asdf version
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.command:
    cmd: "{{ goodmao_home }}/.asdf/bin/asdf version"
    chdir: "{{ goodmao_home }}"
  register: asdf_version_check
  changed_when: false

- name: Remove legacy asdf shell init (pre-0.16)
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.lineinfile:
    path: "{{ goodmao_home }}/.bashrc"
    line: '. "$HOME/.asdf/asdf.sh"'
    state: absent

- name: Add asdf to shell profile
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.blockinfile:
    path: "{{ goodmao_home }}/.bashrc"
    marker: "# {mark} ASDF MANAGED BLOCK"
    block: |
      export ASDF_DATA_DIR="{{ goodmao_home }}/.asdf"
      export PATH="{{ goodmao_home }}/.asdf/bin:{{ goodmao_home }}/.asdf/shims:$PATH"
    create: true
    mode: "0644"

# chdir on every asdf command: a become_user command otherwise runs from Ansible's temp
# directory under root's home, which the service user cannot read, and asdf (a Go binary)
# exits 1 without a word when it cannot stat its working directory.
- name: Install asdf erlang plugin
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.command:
    cmd: "{{ goodmao_home }}/.asdf/bin/asdf plugin add erlang"
    chdir: "{{ goodmao_home }}"
    creates: "{{ goodmao_home }}/.asdf/plugins/erlang"
  environment:
    ASDF_DATA_DIR: "{{ goodmao_home }}/.asdf"

- name: Install asdf elixir plugin
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.command:
    cmd: "{{ goodmao_home }}/.asdf/bin/asdf plugin add elixir"
    chdir: "{{ goodmao_home }}"
    creates: "{{ goodmao_home }}/.asdf/plugins/elixir"
  environment:
    ASDF_DATA_DIR: "{{ goodmao_home }}/.asdf"

# After a Debian release upgrade the installed Erlang is linked against the old
# system's glibc and OpenSSL, and the deploy's NIFs and BEAM files belong to it.
# `-e rebuild_erlang=yes` removes every Erlang build and the previous build
# artifacts first, so the install below runs again on the new system (the
# running release keeps its own copy of the runtime and is unaffected until the
# next deploy replaces it). Elixir is bytecode and needs no rebuild.
- name: Find the Erlang builds to rebuild
  ansible.builtin.find:
    paths: "{{ goodmao_home }}/.asdf/installs/erlang"
    file_type: directory
    recurse: false
  register: erlang_builds
  when: rebuild_erlang | default('') == 'yes'

- name: Remove the Erlang builds from the previous system
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ erlang_builds.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: rebuild_erlang | default('') == 'yes'

# kerl (the plugin's builder) registers every installation by path in its own
# directory; with the install gone and the entry left, kerl 4.4 refuses to
# install there again, and says so only on a terminal. The directory is a
# cache (sources, builds, registries), so it goes with the builds.
- name: Remove kerl's cache and registries along with the builds
  ansible.builtin.file:
    path: "{{ goodmao_home }}/.asdf/plugins/erlang/kerl-home"
    state: absent
  when: rebuild_erlang | default('') == 'yes'

- name: Remove build artifacts made with the previous Erlang
  ansible.builtin.file:
    path: "{{ deploy_path }}/src/_build/prod"
    state: absent
  when: rebuild_erlang | default('') == 'yes'

- name: Install Erlang {{ erlang_version }}
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.command:
    cmd: "{{ goodmao_home }}/.asdf/bin/asdf install erlang {{ erlang_version }}"
    chdir: "{{ goodmao_home }}"
    creates: "{{ goodmao_home }}/.asdf/installs/erlang/{{ erlang_version }}"
  environment:
    ASDF_DATA_DIR: "{{ goodmao_home }}/.asdf"
    PATH: "{{ goodmao_home }}/.asdf/bin:{{ goodmao_home }}/.asdf/shims:{{ ansible_facts.env.PATH }}"

- name: Set the global default Erlang to {{ erlang_version }}
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.command:
    cmd: "{{ goodmao_home }}/.asdf/bin/asdf set --home erlang {{ erlang_version }}"
    chdir: "{{ goodmao_home }}"
  environment:
    ASDF_DATA_DIR: "{{ goodmao_home }}/.asdf"
  changed_when: true

- name: Install Elixir {{ elixir_version }}
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.command:
    cmd: "{{ goodmao_home }}/.asdf/bin/asdf install elixir {{ elixir_version }}"
    chdir: "{{ goodmao_home }}"
    creates: "{{ goodmao_home }}/.asdf/installs/elixir/{{ elixir_version }}"
  environment:
    ASDF_DATA_DIR: "{{ goodmao_home }}/.asdf"
    PATH: "{{ goodmao_home }}/.asdf/bin:{{ goodmao_home }}/.asdf/shims:{{ ansible_facts.env.PATH }}"

- name: Set the global default Elixir to {{ elixir_version }}
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.command:
    cmd: "{{ goodmao_home }}/.asdf/bin/asdf set --home elixir {{ elixir_version }}"
    chdir: "{{ goodmao_home }}"
  environment:
    ASDF_DATA_DIR: "{{ goodmao_home }}/.asdf"
  changed_when: true

- name: Install Hex
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.command:
    cmd: "{{ goodmao_home }}/.asdf/bin/asdf exec mix local.hex --force"
    chdir: "{{ goodmao_home }}"
  environment:
    ASDF_DATA_DIR: "{{ goodmao_home }}/.asdf"
    PATH: "{{ goodmao_home }}/.asdf/bin:{{ goodmao_home }}/.asdf/shims:{{ ansible_facts.env.PATH }}"
  changed_when: false

- name: Install Rebar
  become: true
  become_user: "{{ goodmao_user }}"
  ansible.builtin.command:
    cmd: "{{ goodmao_home }}/.asdf/bin/asdf exec mix local.rebar --force"
    chdir: "{{ goodmao_home }}"
  environment:
    ASDF_DATA_DIR: "{{ goodmao_home }}/.asdf"
    PATH: "{{ goodmao_home }}/.asdf/bin:{{ goodmao_home }}/.asdf/shims:{{ ansible_facts.env.PATH }}"
  changed_when: false
