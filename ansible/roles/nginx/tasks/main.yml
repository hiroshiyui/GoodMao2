---
# Adds a GoodMao2 vhost to the shared nginx. Keyed on its own server_name and
# proxying to its own loopback port, it co-exists with any sibling app's vhost.
- name: Install nginx and certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Create ACME webroot directory
  ansible.builtin.file:
    path: /var/www/certbot
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

# --- SSL bootstrap (chicken-and-egg solution) ---
# 1. Deploy HTTP-only config with ACME challenge location
# 2. Obtain certificate via certbot
# 3. Deploy full HTTPS config

- name: Check if SSL certificate exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  register: ssl_cert

- name: Deploy pre-SSL nginx config
  when: not ssl_cert.stat.exists
  ansible.builtin.template:
    src: goodmao2-pre-ssl.conf.j2
    dest: /etc/nginx/sites-available/goodmao2
    mode: "0644"
  notify: Reload nginx

- name: Enable goodmao2 nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/goodmao2
    dest: /etc/nginx/sites-enabled/goodmao2
    state: link
  notify: Reload nginx

- name: Flush handlers to start nginx with pre-SSL config
  ansible.builtin.meta: flush_handlers

- name: Obtain SSL certificate with certbot
  when: not ssl_cert.stat.exists
  ansible.builtin.command:
    cmd: >
      certbot certonly --webroot
      --webroot-path /var/www/certbot
      --domain {{ domain }}
      --email {{ certbot_email }}
      --agree-tos
      --non-interactive
    creates: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"

- name: Deploy custom 502 maintenance page
  ansible.builtin.copy:
    src: 502.html
    dest: /usr/share/nginx/html/goodmao2-502.html
    mode: "0644"

- name: Deploy full nginx config with SSL
  ansible.builtin.template:
    src: goodmao2.conf.j2
    dest: /etc/nginx/sites-available/goodmao2
    mode: "0644"
    backup: true
  register: goodmao2_site_config
  notify: Reload nginx

# --- Validation, and why it is three tasks rather than `validate:` ---
# `template`'s `validate:` runs against the rendered *temporary* file, and this
# template is a bare `server { … }` block: `nginx -t -c <file>` reads it as a
# whole main configuration and rejects the top-level `server` as a syntax
# error. The fragment is only valid once nginx.conf includes it, so the check
# runs after the write — and putting the previous file back is part of it.
#
# Unchecked, a bad render fails silently: `systemctl reload` refuses it, nginx
# keeps serving the config it already holds, and nothing looks wrong until the
# next restart or reboot finds no working config to start from.
#
# `failed_when: false` lets the restore run; the explicit `fail` stops the
# play, which is also what keeps the queued `Reload nginx` handler from firing.
# `backup: true` leaves timestamped copies in sites-available/, which are inert
# (nginx includes sites-enabled/, holding only the symlink).
#
# The pre-SSL template gets no equivalent: when it is written,
# sites-enabled/goodmao2 does not exist yet, so `nginx -t` would not read it —
# a check that passes whatever the file holds reads as coverage it isn't. That
# path runs only on a new server, where `flush_handlers` fails loudly with an
# operator watching. (Baudrate e7198316.)
- name: Validate the nginx configuration
  when: goodmao2_site_config is changed
  ansible.builtin.command:
    cmd: nginx -t
  register: nginx_config_check
  changed_when: false
  failed_when: false
  # Read-only, so it runs under --check too (validating what is on the server).
  check_mode: false

- name: Restore the previous nginx config if the new one is invalid
  when:
    - nginx_config_check.rc | default(0) != 0
    - goodmao2_site_config.backup_file is defined
  ansible.builtin.copy:
    src: "{{ goodmao2_site_config.backup_file }}"
    dest: /etc/nginx/sites-available/goodmao2
    remote_src: true
    mode: "0644"

- name: Fail if the nginx configuration is invalid
  when: nginx_config_check.rc | default(0) != 0
  ansible.builtin.fail:
    msg: |
      The rendered nginx configuration is invalid. nginx was NOT reloaded and
      is still serving its previous configuration.

      {% if goodmao2_site_config.backup_file is defined %}
      The previous config has been restored to
      /etc/nginx/sites-available/goodmao2 from
      {{ goodmao2_site_config.backup_file }}.
      {% else %}
      There was no previous config to restore, so
      /etc/nginx/sites-available/goodmao2 still holds the invalid render.
      {% endif %}

      {{ nginx_config_check.stderr | default(nginx_config_check.stdout) }}

- name: Enable certbot auto-renewal timer
  ansible.builtin.systemd:
    name: certbot.timer
    state: started
    enabled: true
